<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Crafty Girl Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #fff9fb;
      --card: #ffffff;
      --accent: #f3b7d4;
      --accent-dark: #c46a9a;
      --text: #333333;
      --muted: #777777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }

    h1, h2, h3 {
      color: var(--accent-dark);
      margin-top: 0;
    }

    h1 {
      font-size: 2.4rem;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 24px 22px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      border: 1px solid rgba(244, 189, 214, 0.4);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0.75rem;
      font-size: 1.3rem;
    }

    .section-title span.emoji {
      font-size: 1.4rem;
    }

      margin: 0 0 0.7rem;
    }
